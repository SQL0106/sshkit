name: windows

# 在真正的 Windows 上验证 PowerShell 版：
#   * 离线用例：命令构造无引号、PowerShell 常驻 loop 握手
#   * 联机用例：runner 上开本地 sshd（DefaultShell=pwsh），真跑 wsh / sess
#   * 兼容性：Windows PowerShell 5.1 也要能跑通
on:
  push:
    paths:
      - 'win/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'win/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # CI 里不许无限等：20s 内连第一帧都收不到就判定会话坏了
      SSHKIT_SESS_FIRST_BYTE: '20'
      # 阶段跟踪：卡住时能从日志看出停在哪一步
      SSHKIT_SESS_TRACE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 启用本地 sshd（密钥登录，默认 shell = pwsh 7）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }

          # 一次性密钥（-N '' 是真空口令；写成 '""' 会被当成两个字面引号）
          $key = Join-Path $env:RUNNER_TEMP 'ci_key'
          if (Test-Path $key) { Remove-Item $key -Force }
          & ssh-keygen -t ed25519 -f $key -N '' -q
          if ($LASTEXITCODE -ne 0) { throw 'ssh-keygen 失败' }
          # 自检：能无口令导出公钥，说明私钥没有 passphrase
          & ssh-keygen -y -f $key | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '私钥带口令（-N 没生效）' }

          # 管理员账号登录走 administrators_authorized_keys（ACL 必须收紧）
          $sshProg = Join-Path $env:ProgramData 'ssh'
          New-Item -ItemType Directory -Force -Path $sshProg | Out-Null
          $ak = Join-Path $sshProg 'administrators_authorized_keys'
          Copy-Item "$key.pub" $ak -Force
          icacls $ak /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'
          Write-Host "authorized_keys: $ak"
          Get-Content $ak | ForEach-Object { Write-Host "  key: $($_.Substring(0, [Math]::Min(40, $_.Length)))..." }
          Select-String -Path (Join-Path $sshProg 'sshd_config') -Pattern 'AuthorizedKeysFile|Match Group' |
            ForEach-Object { Write-Host "  config: $($_.Line.Trim())" }

          # 默认 shell = pwsh 7：wsh 的 auto 探测和 sess 的 windows loop 都依赖它
          $pwsh = (Get-Command pwsh).Source
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell `
            -Value $pwsh -PropertyType String -Force | Out-Null

          Start-Service sshd

          # 让 `ssh localhost` 免交互：写用户 ssh config
          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          @"
          Host localhost
              User $env:USERNAME
              IdentityFile $key
              StrictHostKeyChecking no
              UserKnownHostsFile NUL
              IdentitiesOnly yes
          "@ | Set-Content -Path (Join-Path $sshDir 'config') -Encoding ascii

          & ssh -o BatchMode=yes localhost 'echo sshd-ok'
          if ($LASTEXITCODE -ne 0) {
            Write-Host '--- 诊断 ---'
            Get-Service sshd | Format-List Name, Status, StartType | Out-String | Write-Host
            & ssh -vv -o BatchMode=yes localhost 'echo probe' 2>&1 |
              Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
            throw 'sshd 没起来'
          }

      - name: 离线用例（pwsh 7）
        shell: pwsh
        run: pwsh -NoProfile -File win/tests/smoke.ps1

      - name: 探针（ssh 输出捕获是否正常）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- 1) 本地 pwsh 直接输出 ---'
          $o = & pwsh -NoProfile -Command '"hello-from-ps"'
          Write-Host "captured=[$o]"

          Write-Host '--- 2) ssh 直接输出（不捕获） ---'
          ssh localhost '"hello-from-ssh"'
          Write-Host "rc=$LASTEXITCODE"

          Write-Host '--- 3) ssh 直接输出（捕获） ---'
          $o = ssh localhost '"hello-from-ssh"'
          Write-Host "captured=[$o] rc=$LASTEXITCODE"

          Write-Host '--- 4) 经 wsh --direct ---'
          $o = & pwsh -NoProfile -File win/wsh.ps1 --direct localhost '"hello-from-wsh"'
          Write-Host "captured=[$o] rc=$LASTEXITCODE"

          Write-Host '--- 5) wsh 脚本内部构造 ---'
          $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('"hello-raw"'))
          $expr = "& ([scriptblock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('$b'))))"
          $o = ssh localhost $expr
          Write-Host "captured=[$o] rc=$LASTEXITCODE"

          Write-Host '--- 6) 中文：捕获后的字符码 ---'
          $o = ssh localhost '"中文"'
          $s = ($o -join '')
          Write-Host ("len=" + $s.Length + " codes=" + (([int[]][char[]]$s) -join ','))

          Write-Host '--- 7) 中文：原始字节（不经过 PS 解码） ---'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = 'ssh'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          foreach ($x in @('localhost', '"中文"')) { $psi.ArgumentList.Add($x) }
          $p2 = [System.Diagnostics.Process]::Start($psi)
          $ms = New-Object System.IO.MemoryStream
          $p2.StandardOutput.BaseStream.CopyTo($ms)
          $p2.WaitForExit()
          $bytes = $ms.ToArray()
          Write-Host ("raw bytes=" + (($bytes | ForEach-Object { $_.ToString('x2') }) -join ' '))
          Write-Host ("local OutputEncoding=" + [Console]::OutputEncoding.WebName + " cp=" + [Console]::OutputEncoding.CodePage)

      - name: 联机用例·一次性 ssh（不依赖 sess）
        shell: pwsh
        run: pwsh -NoProfile -File win/tests/smoke.ps1 -WinHostName localhost -NoSess

      - name: 会话诊断（有界，失败也打印 keeper 日志）
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $env:SSHKIT_SESS_FIRST_BYTE = '15'
          Write-Host '--- sess kind ---'
          & pwsh -NoProfile -File win/sess.ps1 kind --reset localhost

          $info = & pwsh -NoProfile -File win/sess.ps1 __remote localhost
          Write-Host ("kind=" + [string]$info[0] + " b64len=" + ([string]$info[1]).Length)

          # 带阶段跟踪跑一次 sess run，40s 硬超时（Start-Process + Kill，不依赖 job）
          $env:SSHKIT_SESS_TRACE = '1'
          $env:SSHKIT_SESS_FIRST_BYTE = '10'
          $exe = (Get-Command pwsh).Source
          $o = Join-Path $env:RUNNER_TEMP 'sess.out'
          $e = Join-Path $env:RUNNER_TEMP 'sess.err'
          $p = Start-Process -FilePath $exe `
            -ArgumentList @('-NoProfile', '-File', 'win/sess.ps1', 'run', 'localhost', '2+2') `
            -PassThru -NoNewWindow -RedirectStandardOutput $o -RedirectStandardError $e
          if (-not $p.WaitForExit(40000)) { $p.Kill(); Write-Host 'TIMEOUT(40s): sess run 未返回' }
          Write-Host '--- sess stdout ---'
          Get-Content $o -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          Write-Host '--- sess stderr（含 trace） ---'
          Get-Content $e -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }

          $log = Join-Path $env:USERPROFILE '.cache\sess\localhost.v4.log'
          if (Test-Path $log) {
            Write-Host "--- keeper 日志 ---"
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "（没有 $log）"
          }
          Get-ChildItem (Join-Path $env:USERPROFILE '.cache\sess') -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  file: " + $_.Name + " " + $_.Length) }
          & pwsh -NoProfile -File win/sess.ps1 stop localhost

      - name: 联机用例·sess
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: pwsh -NoProfile -File win/tests/smoke.ps1 -WinHostName localhost

      - name: 兼容性（Windows PowerShell 5.1 跑同一套离线用例）
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win/tests/smoke.ps1

      - name: wsh 行为（sess / direct / 解释器切换 / 中文 / 退出码）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Contains($name, $needle, $actual) {
            if (($actual -join "`n") -notmatch [regex]::Escape($needle)) {
              throw "$name 失败：期望包含 '$needle'，实际：$($actual -join ' | ')"
            }
            Write-Host "PASS  $name"
          }

          $wsh = 'win/wsh.ps1'

          # 默认路径：sess（常驻 pwsh loop）+ 中文 + 表达式
          $o = & pwsh -NoProfile -File $wsh localhost '"中文-" + (1+1)'
          Assert-Contains 'wsh 默认(sess) 中文' '中文-2' $o

          # 状态保持：sess 里 cd 之后仍然生效
          & pwsh -NoProfile -File $wsh localhost 'Set-Location $env:SystemRoot' | Out-Null
          $o = & pwsh -NoProfile -File $wsh localhost '(Get-Location).Path'
          Assert-Contains 'sess 状态保持' $env:SystemRoot $o

          # 一次性 ssh
          $o = & pwsh -NoProfile -File $wsh --direct localhost '"direct-ok"'
          Assert-Contains 'wsh --direct' 'direct-ok' $o

          # 退出码透传
          & pwsh -NoProfile -File $wsh --direct localhost 'exit 7' | Out-Null
          if ($LASTEXITCODE -ne 7) { throw "退出码应为 7，实际 $LASTEXITCODE" }
          Write-Host 'PASS  退出码透传'

          # 跨解释器：cmd 与 PS 5.1
          $o = & pwsh -NoProfile -File $wsh --direct --shell cmd localhost 'echo cmd-ok'
          Assert-Contains 'wsh --shell cmd' 'cmd-ok' $o
          $o = & pwsh -NoProfile -File $wsh --direct --shell ps5 localhost '5.1-major=$($PSVersionTable.PSVersion.Major)'
          Assert-Contains 'wsh --shell ps5' '5.1-major=5' $o

          # -f：多行脚本 + 函数 + 中文 + 退出码
          $f = Join-Path $env:RUNNER_TEMP 't.ps1'
          @'
          function Double($x) { $x * 2 }
          "f=" + (Double 21)
          "中文"
          exit 9
          '@ | Set-Content -Path $f -Encoding utf8
          & pwsh -NoProfile -File $wsh -f --direct localhost $f | Out-Null
          if ($LASTEXITCODE -ne 9) { throw "退出码应为 9，实际 $LASTEXITCODE" }
          Write-Host 'PASS  -f 脚本'

          # kind 探测
          $k = & pwsh -NoProfile -File $wsh kind --reset localhost
          if (($k -join '') -ne 'pwsh') { throw "kind 应为 pwsh，实际 $k" }
          Write-Host 'PASS  kind 探测'

          & pwsh -NoProfile -File win/sess.ps1 stop localhost | Out-Null

      - name: 安装脚本（隔离目录，不动 PATH/profile）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'shk'
          & pwsh -NoProfile -File win/install.ps1 -Dest $dest -NoPath -NoProfile
          foreach ($f in @('rsh.ps1','wsh.ps1','sess.ps1','sshkit-lib.ps1')) {
            if (-not (Test-Path (Join-Path $dest "win\$f"))) { throw "缺 $f" }
          }
          foreach ($f in @('rsh.cmd','wsh.cmd','sess.cmd')) {
            if (-not (Test-Path (Join-Path $dest "bin\$f"))) { throw "缺 $f" }
          }
          $o = & (Join-Path $dest 'bin\rsh.cmd') --help
          if (($o -join "`n") -notmatch 'rsh') { throw 'cmd 入口不可用' }
          Write-Host 'PASS  install.ps1'
